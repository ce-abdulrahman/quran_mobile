name: quran_mobile
description: Quran mobile Flutter app
publish_to: none
version: 0.0.1+1
environment:
  sdk: ">=3.11.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  adhan: ^2.0.0+1
  dio: ^5.7.0
  home_widget: ^0.7.0
  audioplayers: ^6.1.1
  flutter_local_notifications: 18.0.1
  timezone: 0.9.4
  share_plus: ^10.1.3
  path_provider: ^2.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - images/
  fonts:
    - family: Patua One
      fonts:
        - asset: assets/fonts/en/PatuaOne-Regular.ttf
          weight: 400
        - asset: assets/fonts/en/PatuaOne-Regular.ttf
          weight: 500
        - asset: assets/fonts/en/PatuaOne-Regular.ttf
          weight: 700
