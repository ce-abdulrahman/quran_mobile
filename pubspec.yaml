name: quran_mobile
description: Quran mobile Flutter app
publish_to: none
version: 1.0.2+3
environment:
  sdk: ">=3.11.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  adhan: ^2.0.0+1
  dio: ^5.7.0
  home_widget: ^0.7.0
  audioplayers: ^6.1.1
  flutter_local_notifications: 18.0.1
  timezone: 0.9.4
  share_plus: ^10.1.3
  path_provider: ^2.1.3
  confetti: ^0.8.0
  encrypt: ^5.0.3
  file_picker: ^11.0.2
  crypto: ^3.0.3
  fl_chart: ^0.70.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  archive: ^3.6.1
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  flutter_markdown: ^0.7.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/themes/kaaba/
    - assets/themes/madinah/
    - assets/data/
    - assets/data/quran/
    - assets/reciters/
    - assets/companions/
  fonts:
    - family: Patua One
      fonts:
        - asset: assets/fonts/en/PatuaOne-Regular.ttf
          weight: 400
        - asset: assets/fonts/en/PatuaOne-Regular.ttf
          weight: 500
        - asset: assets/fonts/en/PatuaOne-Regular.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/ar/QPC_Hafs.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/ar/Amiri-Regular.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/ar/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ar/ScheherazadeNew-Regular.ttf
    - family: Wafeq
      fonts:
        - asset: assets/fonts/ar/Wafeq-Regular.otf
    - family: Hafs18
      fonts:
        - asset: assets/fonts/ar/hafs.18.ttf
    - family: HafsSmart
      fonts:
        - asset: assets/fonts/ar/hafssmart.8.ttf
    - family: Warsh
      fonts:
        - asset: assets/fonts/ar/warsh.10.ttf
    - family: NizarNastaliq
      fonts:
        - asset: assets/fonts/ku/1_NizarNastaliqKurdish.ttf
    - family: UniQAIDAR
      fonts:
        - asset: assets/fonts/ku/2_UniQAIDAR_Nastaliq_001.ttf
    - family: NRTBd
      fonts:
        - asset: assets/fonts/ku/3_NRT-Bd.ttf
    - family: NormalGanel
      fonts:
        - asset: assets/fonts/ku/4_Normal_Ganel_KJino.TTF
    - family: SarchiaQaisy
      fonts:
        - asset: assets/fonts/ku/5_Sarchia_Qaisy.ttf
    - family: SarchiaMakka
      fonts:
        - asset: assets/fonts/ku/6_Sarchia_Makka.ttf
    - family: RudawBold
      fonts:
        - asset: assets/fonts/ku/7_not_saport_kurdish_rudawbold.ttf
    - family: SurahHeader
      fonts:
        - asset: assets/fonts/ar/Surah_Header.ttf
    - family: QPCV4Tajweed
      fonts:
        - asset: assets/fonts/ar/QPC_V4_Tajweed.ttf
